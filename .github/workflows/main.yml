              fun gfx(): View = scroll {
                  addView(back())
                  addView(tv(t("Grafik PC/MC|PC/MC Graphics"), 28f, P.txt, true), lp().apply { topMargin = dp(16) })
                  addView(tv(t("Atur render ANGLE untuk game target.|Tune ANGLE rendering for the target game."), 13f, P.sub))
