                  put(cardI("pad", t("Game target|Target game"), pk))
                  val cur = sp.getString("gfxm", "") ?: ""
                  fun doGfx(kind: String, extra: String) {
                      if (!Sh.ok) { noAcc(); return }
                      val p = pk.text.toString().trim()
                      sp.edit().putString("tgt", p).putString("gfxm", kind).apply()
                      cmd("settings put global angle_gl_driver_selection_pkgs $p && settings put global angle_gl_driver_selection_values angle && setprop debug.angle.feature_overrides_enabled $extra && am force-stop $p", kind)
                      show()
                  }
                  put(sec(t("Mode grafik|Graphics mode")))
                  put(actRow("wave", "Smooth Graphics", t("Tekstur halus, anisotropic off, LOD +4|Smooth textures, anisotropic off, LOD +4"), cur == "smooth") {
                      doGfx("smooth", "disableAnisotropicFiltering:forceTextureLodOffset4")
                  })
                  put(actRow("apps", "Pixel Graphics", t("Filter nearest bergaya pixel|Nearest filtering, pixel style"), cur == "pixel") {
                      doGfx("pixel", "forceNearestFiltering:disableAnisotropicFiltering:forceTextureLodOffset4")
                  })
                  put(actRow("undo", "Restore Default", t("Kembalikan ke pengaturan bawaan|Back to default settings")) {
                      if (!Sh.ok) { noAcc() } else {
                          val p = pk.text.toString().trim()
                          sp.edit().putString("gfxm", "").apply()
                          cmd("settings delete global angle_gl_driver_selection_values && settings delete global angle_gl_driver_selection_pkgs && setprop debug.angle.feature_overrides_enabled \"\" && am force-stop $p", "Default")
                          show()
                      }
                  })
                  put(sec(t("Diagnostik|Diagnostics")))
                  val out = tv("", 12f, P.txt).apply { typeface = Typeface.MONOSPACE }
                  val outCard = vbox(P.card, 14, 20).apply { addView(out); visibility = View.GONE }
                  put(actRow("check", t("Cek dukungan render ANGLE|Check ANGLE support"), t("Cari library ANGLE di sistem|Look for ANGLE libraries")) {
                      ex.execute {
                          val r = Sh.run("ls -d /system/*/*angle* /vendor/*/*angle* 2>/dev/null")
                          ui.post { out.text = if (r.isBlank()) t("ANGLE tidak ditemukan|ANGLE not found") else r; outCard.visibility = View.VISIBLE }
                      }
                  })
                  put(outCard)
              }

              // ---------- DOWNSCALE ----------
              fun ds(): View = scroll {
                  addView(back())
                  put(tv("Downscale", 26f, P.txt, true))
                  val info = tv("...", 13f, P.sub)
                  loadPhys { info.text = "${t("Resolusi asli|Native res")}: ${pw}x$ph • DPI $pd\n${t("DPI disesuaikan otomatis mengikuti skala.|DPI is adjusted automatically with the scale.")}" }
                  addView(info)
                  for (r in 0..2) {
                      val row = LinearLayout(this@MainActivity)
                      for (j in 1..3) {
                          val n = r * 3 + j
                          row.addView(btn("0.$n") {
                              if (pw > 0) applyRes((pw * n / 10) / 2 * 2, (ph * n / 10) / 2 * 2)
                          }, lp(0, -2, 1f, 4))
                      }
                      put(row)
                  }
                  put(btn("Reset", true) { resetRes() })
              }

              // ---------- SETTINGS ----------
              fun settings(): View = scroll {
                  addView(tv(t("Pengaturan|Settings"), 28f, P.txt, true))
                  val th = sp.getString("theme", "system")
                  fun thBtn(k: String, l: String) = btn(l, th == k) {
                      sp.edit().putString("theme", k).putInt("rt", 3).apply(); recreate()
                  }
                  put(cardI("sun", t("Tema warna|Color theme"), hs(thBtn("system", t("Sistem|System")), thBtn("light", "Light"), thBtn("dark", "Dark"))))
                  put(cardI("globe", t("Bahasa|Language"), hs(
                      btn("Indonesia", lang == "id") { lang = "id"; sp.edit().putString("lang", "id").apply(); show() },
                      btn("English", lang == "en") { lang = "en"; sp.edit().putString("lang", "en").apply(); show() })))
                  put(cardI("share", t("Sosial media|Social media"),
                      actRow("share", "TikTok", "@lutfikreji") { open("https://www.tiktok.com/@lutfikreji") },
                      actRow("share", t("Saluran WhatsApp|WhatsApp channel"), "WhatsApp") { open("https://whatsapp.com/channel/0029Vb8BjUO6WaKsAOUqWK0I") }))
                  put(cardI("info", t("Tentang|About"),
                      tv(t("Developer|Developer") + ": lutfikreji", 14f, P.sub),
                      tv(t("Versi aplikasi|App version") + ": 1.0.0", 14f, P.sub)))
              }
          }
          EOF

      - name: Build debug APK
        working-directory: zo
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp zo/app/build/outputs/apk/debug/app-debug.apk ZenithOptimizer-1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ZenithOptimizer
          path: ZenithOptimizer-1.0.0.apk
