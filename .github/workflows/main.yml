              fun open(u: String) = startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u)))
              fun noAcc() = toast(t("Akses Shizuku/Root belum aktif|Shizuku/Root access not active"))
              fun cmd(c: String, msg: String = "OK") {
                  if (!Sh.ok) { noAcc(); return }
                  ex.execute { val r = Sh.run(c); ui.post { toast(if (r.startsWith("ERR")) r else msg) } }
