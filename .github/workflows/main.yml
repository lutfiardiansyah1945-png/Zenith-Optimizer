              // ---------- APPS ----------
              fun apps(): View {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(48), dp(16), 0) }
                  col.addView(tv(t("Daftar aplikasi|App list"), 28f, P.txt, true))
                  val et = edit(t("Cari aplikasi...|Search apps..."))
                  col.addView(et, lp().apply { topMargin = dp(10); bottomMargin = dp(10) })
                  val lv = ListView(this).apply { divider = null; setPadding(0, 0, 0, dp(110)); clipToPadding = false }
                  col.addView(lv, lp(-1, 0, 1f))
                  var all = listOf<AppI>()
                  var shown = listOf<AppI>()
                  val green = c("#4CAF50"); val red = c("#EF5350"); val blue = c("#7986CB")
                  val ad = object : BaseAdapter() {
                      override fun getCount() = shown.size
                      override fun getItem(i: Int) = shown[i]
                      override fun getItemId(i: Int) = i.toLong()
                      override fun getView(i: Int, cv: View?, p: ViewGroup?): View {
                          val a = shown[i]
                          val en = enSet().contains(a.pkg)
                          val r = hbox().apply { background = bg(P.card, 16); setPadding(dp(14), dp(12), dp(14), dp(12)) }
                          val ic = ImageView(this@MainActivity)
                          var d = icons.get(a.pkg)
                          if (d == null) { d = try { packageManager.getApplicationIcon(a.pkg) } catch (e: Exception) { null }; if (d != null) icons.put(a.pkg, d) }
                          ic.setImageDrawable(d)
                          r.addView(ic, lp(dp(46), dp(46)))
                          val tx = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL }
                          tx.addView(tv(a.label, 16f, P.txt, true).apply { isSingleLine = true })
                          tx.addView(tv(a.pkg, 12f, P.sub).apply { isSingleLine = true })
                          val cr = hbox()
                          cr.addView(chip(if (en) t("Diaktifkan|Enabled") else t("Dinonaktifkan|Disabled"), if (en) green else red), lp(-2, -2).apply { rightMargin = dp(8) })
                          if (a.game) cr.addView(chip(t("Direkomendasikan|Recommended"), blue))
                          tx.addView(cr, lp().apply { topMargin = dp(6) })
                          r.addView(tx, lp(0, -2, 1f).apply { leftMargin = dp(14) })
                          r.setOnClickListener {
                              val s = enSet(); if (!s.add(a.pkg)) s.remove(a.pkg)
                              sp.edit().putStringSet("en", s).apply(); notifyDataSetChanged()
                          }
                          return LinearLayout(this@MainActivity).apply { setPadding(0, 0, 0, dp(6)); addView(r, lp()) }
                      }
                  }
                  lv.adapter = ad
                  et.onText { q ->
                      shown = all.filter { it.label.contains(q, true) || it.pkg.contains(q, true) }
                      ad.notifyDataSetChanged()
                  }
                  Thread {
                      val pm = packageManager
                      val l = pm.getInstalledApplications(0).map { AppI(it.loadLabel(pm).toString(), it.packageName, isGame(it)) }
                          .filter { it.pkg != packageName }
                          .sortedWith(compareByDescending<AppI> { it.game }.thenBy { it.label.lowercase() })
                      if (!sp.contains("en")) sp.edit().putStringSet("en", l.filter { it.game }.map { it.pkg }.toHashSet()).apply()
                      ui.post { all = l; shown = l; ad.notifyDataSetChanged() }
                  }.start()
                  return col
              }

